spring:
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:default_secret_fallback_key_min_32_chars_xyz}
    hosteller-expiry-ms: 86400000
    staff-expiry-ms: 86400000
    superadmin-expiry-ms: 28800000
    refresh-expiry-ms: 2592000000
  notification:
    skip-email: false
    skip-sms: false
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:test_key}
    key-secret: ${RAZORPAY_KEY_SECRET:test_secret}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:test_webhook_secret}
  frontend-url: http://localhost:5173
  azure:
    blob:
      connection-string: ${AZURE_BLOB_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=devaccount;AccountKey=devkey;EndpointSuffix=core.windows.net}
      container-name: ${AZURE_BLOB_CONTAINER:hostlify}
      sas-expiry-minutes: 15
