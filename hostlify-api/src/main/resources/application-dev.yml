spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hostlify-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

app:
  jwt:
    secret: dev_secret_key_min_32_chars_long_here_abcdef1234567890
  notification:
    skip-email: true
    skip-sms: true

logging:
  level:
    com.hostlify: DEBUG
    org.hibernate.SQL: DEBUG
